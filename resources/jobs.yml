resources:
  jobs:
    register_agent_model:
      name: "[${bundle.target}] register_agent_model"
      tasks:
        - task_key: log_and_register
          notebook_task:
            notebook_path: ../notebooks/01_log_and_register_model.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - -r ../requirements.txt
